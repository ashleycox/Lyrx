name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-26
    env:
      # Keep the supported CI baseline explicit instead of following runner-default changes.
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Check repository, test, and build both platforms
        run: Scripts/verify.sh
      - name: Test iPhone interface
        run: Scripts/test-ui.sh
      - name: Test Mac interface
        env:
          LYRX_UI_DESTINATION: platform=macOS
          LYRX_UI_BUILD_ROOT: ${{ runner.temp }}/lyrx-mac-ui
        run: Scripts/test-ui.sh
